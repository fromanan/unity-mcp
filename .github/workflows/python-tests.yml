name: Python Tests

on:
  push:
    # Exclude beta and main: those branches re-trigger this workflow via
    # workflow_call from beta-release.yml / release.yml. Without the exclusion,
    # a push to beta that touches Server/** fires this workflow twice for the
    # same SHA, and GitHub auto-cancels the duplicate.
    branches-ignore: [beta, main]
    paths:
      - Server/**
      - tools/**
      - .github/workflows/python-tests.yml
  pull_request:
    branches: [main, beta]
    paths:
      - Server/**
      - tools/**
      - .github/workflows/python-tests.yml
  workflow_dispatch: {}
  workflow_call:
    inputs:
      ref:
        description: "Git ref to test (defaults to the triggering ref)."
        type: string
        required: false
        default: ""

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.26"

      - name: Set up Python
        run: uv python install ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --project Server --python ${{ matrix.python }} --extra dev

      - name: Run repository Python tests
        run: >-
          uv run --project Server python -m pytest
          -v --tb=short
          --cov=Server/src
          --cov-report=xml:Server/coverage.xml
          --cov-report=html:Server/htmlcov
          --cov-report=term
          --cov-fail-under=62

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          files: ./Server/coverage.xml
          flags: python
          name: python-coverage-${{ matrix.python }}-${{ matrix.os }}
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results-${{ matrix.python }}-${{ matrix.os }}
          path: |
            Server/.pytest_cache/
            Server/tests/
            Server/coverage.xml
            Server/htmlcov/
